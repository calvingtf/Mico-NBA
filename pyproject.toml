[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mironba"
version = "0.1.0"
description = "MiroNBA — multi-agent simulation of counterfactual NBA scenarios"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Presentation agents only - see mironba/llm/providers/claude_sdk.py. Optional
# because the measured arms deliberately do not use it.
sdk = ["claude-agent-sdk>=0.2"]

[tool.setuptools.packages.find]
include = ["mironba*"]

[tool.setuptools.package-data]
"mironba.data" = ["*.sql", "snapshots/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    # Refits the value model against the real snapshot rather than a fixture.
    # A few seconds, not milliseconds, and it needs the nba-stats tables to be
    # present — but it is the test that checks the README's claim against the
    # data the README quotes, so it runs by default rather than being opt-in.
    "slow: refits a model against real snapshot data",
    # Spends real subscription quota or API credit. Opt-in with -m sdk / -m api
    # so a routine test run never bills anything or eats a five-hour window.
    "sdk: calls the Claude Agent SDK over the local subscription",
    "api: calls a hosted model over HTTP with an API key",
]
