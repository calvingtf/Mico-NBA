[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mironba"
version = "0.1.0"
description = "MiroNBA — multi-agent simulation of counterfactual NBA scenarios"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["mironba*"]

[tool.setuptools.package-data]
"mironba.data" = ["*.sql", "snapshots/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    # Refits the value model against the real snapshot rather than a fixture.
    # A few seconds, not milliseconds, and it needs the nba-stats tables to be
    # present — but it is the test that checks the README's claim against the
    # data the README quotes, so it runs by default rather than being opt-in.
    "slow: refits a model against real snapshot data",
]
