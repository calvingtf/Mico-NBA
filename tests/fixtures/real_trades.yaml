  - id: syn-contested-band-at-limit
    label: Contested band - $7.4M out takes back exactly the middle-bracket limit
    kind: synthetic
    season: "2023-24"
    date: "2024-01-15"
    verified: true
    covers: contested-band
    edge_justification: >
      7,400,000 + 7,500,000 = 14,900,000 under the adopted $7,250,000 bracket
      edge. This fixture alone does not discriminate between the two readings:
      the rejected $7.5M reading would allow 15,050,000, which also covers
      14,900,000. Its paired negative, cf-contested-band-boundary at
      14,900,001, is what discriminates - it must be REJECTED, and would be
      legal under the other reading. The pair pins the edge exactly.

      This row is FORMULA rather than REALITY because no real trade can serve
      it. Across 2023-24, 2024-25 and 2025-26 no team sent out a total between
      $7,250,000 and $7,500,000; the nearest was $7,087,519 (UTA, 2025-02-01),
      $162,481 short. See candidate_report.md.
    expected_verdict: approved
    teams:
      BOS: {tier: over_cap, roster: 15}
      WAS: {tier: under_cap, roster: 15}
    players:
      - {name: Contested Contract, salary: 7400000, from: BOS, to: WAS}
      - {name: Return, salary: 14900000, from: WAS, to: BOS}

