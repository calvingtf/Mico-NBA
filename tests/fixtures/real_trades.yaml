  - id: syn-minimum-exception-at-limit
    label: Second-apron team absorbs a 10-year veteran at exactly the minimum
    kind: synthetic
    season: "2025-26"
    date: "2026-01-15"
    verified: true
    covers: minimum-salary-exception
    edge_justification: >
      The 2025-26 minimum for 10+ years of service is $3,634,153. A player at
      that figure does not count as incoming salary, so a second-apron team
      sending nothing out - matching limit $0 - may still acquire him. Paired
      with cf-minimum-exception-one-dollar-over at 3,634,154, which does count
      and is therefore rejected. Apron status is deliberately not a barrier:
      the 2023 CBA bars apron teams from the mid-level and bi-annual
      exceptions, not the minimum.
    expected_verdict: approved
    teams:
      BOS: {tier: second_apron, roster: 14}
      WAS: {tier: under_cap, roster: 15}
    players:
      - {name: Minimum Veteran, salary: 3634153, from: WAS, to: BOS, years_of_service: 10}

