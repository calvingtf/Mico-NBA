# Trades replayed through the validator.
#
# ---------------------------------------------------------------------------
# HOW TEAM SALARIES WORK IN THIS FILE  (read before adding a fixture)
# ---------------------------------------------------------------------------
# A trade's legality depends on each team's total salary, which decides its
# apron tier. Exact team payrolls on a given date are hard to source and easy
# to get wrong, and a wrong payroll produces a confidently wrong verdict.
#
# So a fixture states the *tier* a team was in, not a payroll. The harness
# synthesises a representative salary inside that band. This keeps the test
# honest about what it is actually asserting: "a team in this tier, making this
# trade, gets this verdict" — which is exactly the rule under test. A fixture
# may override with an explicit `salary:` when the real payroll is known.
#
# Tiers: under_cap | over_cap | first_apron | second_apron
#
# ---------------------------------------------------------------------------
# TWO KINDS OF FIXTURE
# ---------------------------------------------------------------------------
# real            An actual trade. Can only ever show the validator is not too
#                 strict. `verified: true` requires salaries checked against a
#                 primary source — none are yet.
# counterfactual  A constructed scenario, usually one that must be rejected.
#                 Shows the validator is not too permissive. These are
#                 `verified: true` because their legality follows from the rule
#                 itself, not from salary data that could be misremembered.
#
# Only a `verified: true` fixture may check a row in the README coverage
# matrix. That is deliberate: checking a row must require real work.
#
# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
#   expected_verdict        approved | rejected | undetermined
#   expected_errors         rule ids that must appear as ERROR findings
#   expected_undetermined   rule ids that must appear as UNDETERMINED findings
#   simplified              a multi-team deal reduced to its principal teams
#   covers                  README matrix row id this fixture is evidence for

