  # =========================================================================
  # FORMULA positives. Synthetic by design: a formula row asks whether the
  # calculation is right at a specific edge, and a synthetic fixture controls
  # the inputs exactly. Each sits *at* the limit and is paired with a
  # counterfactual one dollar past it, so the two together pin the edge.
  # =========================================================================

  - id: syn-small-bracket-at-limit
    label: Below apron, small bracket - $5M out takes back exactly 200% + $250K
    kind: synthetic
    season: "2025-26"
    date: "2026-01-15"
    verified: true
    covers: small-bracket
    edge_justification: >
      200% x 5,000,000 + 250,000 = 10,250,000, the median of the three bracket
      formulas at this outgoing amount. Paired with cf-small-bracket-exceeded
      at 10,250,001.
    expected_verdict: approved
    teams:
      BOS: {tier: over_cap, roster: 15}
      WAS: {tier: under_cap, roster: 15}
    players:
      - {name: Small Contract, salary: 5000000, from: BOS, to: WAS}
      - {name: Return, salary: 10250000, from: WAS, to: BOS}

  - id: syn-middle-bracket-at-limit
    label: Below apron, middle bracket - $20M out takes back outgoing + expanded TPE
    kind: synthetic
    season: "2025-26"
    date: "2026-01-15"
    verified: true
    covers: middle-bracket
    edge_justification: >
      20,000,000 + 8,527,000 = 28,527,000. The middle bracket is the median
      here because 200%+250K (40,250,000) sits above it and 125%+250K
      (25,250,000) below. Paired with cf-middle-bracket-exceeded.
    expected_verdict: approved
    teams:
      BOS: {tier: over_cap, roster: 15}
      WAS: {tier: under_cap, roster: 15}
    players:
      - {name: Mid Contract, salary: 20000000, from: BOS, to: WAS}
      - {name: Return, salary: 28527000, from: WAS, to: BOS}

