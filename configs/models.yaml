# Role -> profile -> model. The point of the indirection is that agent code
# names a job ("gm_agent") and never a model, so swapping models in M5 is an
# edit to this file and nothing else.
#
# Verified on this machine 2026-07-31: both `qwen3.6:35b-a3b` (22.3 GiB) and
# `qwen3.6:27b` (16.2 GiB) are pulled, Q4_K_M. The size difference is the whole
# reason gm_agent moved to local_deep: 22.3 GiB of weights plus a KV cache does
# not fit in 24 GB of VRAM, and every M1/M1.5 number was measured on a model
# Ollama had pushed entirely onto the CPU. 16.2 GiB does fit.

defaults:
  server: ollama
  base_url: http://localhost:11434/v1
  # 1024 truncated 4 of 41 completions mid-JSON in the first measured bench.
  # Every one of those was counted as a schema failure, which is wrong twice
  # over: the model was filling the form correctly, and the headline number
  # then described our max_tokens rather than the model. qwen3.6 writes long
  # rationales; 2048 leaves room for one.
  max_tokens: 2048
  # A cold load of a 24 GB model is minutes, not seconds. Timing out mid-load
  # and calling it a schema failure would corrupt the one number M1 exists to
  # measure.
  request_timeout_s: 600

profiles:
  local_fast:
    model: qwen3.6:35b-a3b       # 36B total, ~3B active — the many-agents pick
    thinking: false
    temperature: 0.8
    top_p: 0.95
    seed: 20260730
    context_length: 4096         # see README: 8192 crashed llama-server on prompt-cache save
    # All 40 layers on the GPU. Ollama's scheduler put this model entirely on
    # the CPU with 22.9 GiB of VRAM free and stayed there across reloads, which
    # cost ~6x latency. Stated explicitly so the placement is a decision on
    # record rather than whatever the scheduler felt like.
    gpu_layers: 40

  local_deep:
    model: qwen3.6:27b           # dense, steadier reasoning, and it fits in VRAM
    thinking: true
    temperature: 0.3
    top_p: 0.9
    seed: 20260730
    # Matches OLLAMA_CONTEXT_LENGTH=16384 on this machine. Asking for more than
    # the server was started with does not raise — it silently reallocates or
    # truncates, and a context that quietly shrank would show up as a schema
    # failure attributed to the model.
    context_length: 16384
    # num_predict covers thinking tokens as well as content on Ollama, so a
    # budget sized for the answer alone truncates mid-reasoning and returns
    # empty content — which arrives as a schema failure and reads as the model
    # being unable to fill a two-field form.
    #
    # Measured thinking blocks on this model run 5.5k-14k characters, roughly
    # 1400-3500 tokens. 4096 was enough for most calls and truncated one in
    # four; the repair retry rescued it, but a truncation counted as a schema
    # failure is the exact contamination `max_tokens` caused at M1. 6144 leaves
    # headroom for a long reasoning block plus the form. It raises the worst
    # case to ~3 minutes at 34 tok/s and leaves the typical call unchanged,
    # because a call that finishes early still finishes early.
    max_tokens: 6144
    gpu_layers: 99               # "all of them"; 27b has fewer than 99

  # Deterministic decoding, for measuring the schema-failure floor without
  # sampling noise. Same model as local_fast.
  local_greedy:
    model: qwen3.6:35b-a3b
    thinking: false
    temperature: 0.0
    top_p: 1.0
    seed: 20260730
    context_length: 8192

  # Nothing provider-specific is needed to point at vLLM or SGLang: the schema
  # goes out as response_format, and the rest is the same OpenAI shape.
  vllm_fast:
    server: vllm
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3.6-35B-A3B
    temperature: 0.8
    top_p: 0.95
    seed: 20260730

roles:
  # Moved off local_fast at M1.6. Not for reasoning quality — for residency.
  # 35b-a3b ran at gpu_fraction 0.0 on this box, so its latency figures
  # described a CPU and its outputs were produced under a 40s/call budget
  # nobody would choose. local_fast stays declared for the M5 comparison.
  gm_agent: local_deep
  media_agent: local_fast
  market_agent: local_fast
  report_agent: local_deep
  default: local_fast
